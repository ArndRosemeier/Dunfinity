<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dunfinity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050607; color: #cfd6dc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* The loading screen (src/app/loadingScreen.ts), drawn before any script runs. */
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: #050607; }
      #loading .name { font: 600 28px/1 Georgia, 'Times New Roman', serif; letter-spacing: 0.32em; text-indent: 0.32em; color: #e8d9b8; text-transform: uppercase; }
      #loading .bar { width: min(280px, 70vw); height: 2px; margin-top: 22px; background: #1b2026; overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 0; background: #c9a86a; transition: width 0.3s; }
      #loading .step { margin-top: 10px; min-height: 1.4em; color: #7d8790; font-size: 12px; letter-spacing: 0.04em; }
      #hud { position: fixed; left: 12px; top: 10px; pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="loading"><div class="name">Dunfinity</div><div class="bar"><i></i></div><div class="step">Loading</div></div>
    <noscript><p style="position:fixed;inset:0;z-index:30;margin:0;padding:40vh 16px 0;text-align:center;background:#050607">Dunfinity needs JavaScript.</p></noscript>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
