name: CI
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs side by side: the unit tests and guards, and the two halves of the shader check
# (the Lab, the game), which each spend minutes in SwiftShader.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  shaders:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [lab, game]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # A PR that touches nothing the browser loads (only docs, change notes, tests or tools) skips
      # the check; on main it always runs.
      - name: Does this change reach the browser?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/|public/|vendor/|index\.html$|vite\.config\.ts$|tsconfig\.json$|package(-lock)?\.json$|tools/shot/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Nothing the browser loads changed: shader check skipped."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        run: npm run build
      - if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.run == 'true'
        run: npm run check:shaders -- ${{ matrix.part }}
